name: Build Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
    # ============================================
    # Checkout do código
    # ============================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ============================================
    # Setup Android NDK
    # ============================================
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager "ndk;25.2.9658665"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9658665" >> $GITHUB_ENV
        echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9658665" >> $GITHUB_ENV

    # ============================================
    # Setup CMake
    # ============================================
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.22.1'

    # ============================================
    # Build
    # ============================================
    - name: Configure CMake
      run: |
        cmake -B build/${{ matrix.abi }}           -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}           -DCMAKE_ANDROID_ARCH_ABI=${{ matrix.abi }}           -DCMAKE_ANDROID_NDK=${{ env.ANDROID_NDK }}           -DCMAKE_SYSTEM_NAME=Android           -DCMAKE_SYSTEM_VERSION=21           -DCMAKE_ANDROID_STL_TYPE=c++_static           -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK }}/build/cmake/android.toolchain.cmake           -DANDROID_ABI=${{ matrix.abi }}           -DANDROID_PLATFORM=android-21           -DANDROID_STL=c++_static

    - name: Build
      run: cmake --build build/${{ matrix.abi }} --config ${{ env.BUILD_TYPE }} -j$(nproc)

    # ============================================
    # Upload artifact
    # ============================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libstopwatch-${{ matrix.abi }}
        path: build/${{ matrix.abi }}/libstopwatch.so

    # ============================================
    # Release (apenas em tags)
    # ============================================
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/${{ matrix.abi }}/libstopwatch.so
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Job para criar release com múltiplas ABIs
  # ============================================
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create release archive
      run: |
        mkdir -p release/libs/armeabi-v7a
        mkdir -p release/libs/arm64-v8a
        cp artifacts/libstopwatch-armeabi-v7a/libstopwatch.so release/libs/armeabi-v7a/
        cp artifacts/libstopwatch-arm64-v8a/libstopwatch.so release/libs/arm64-v8a/
        cd release && zip -r ../stopwatch-hook-${{ github.ref_name }}.zip libs/

    - name: Upload release archive
      uses: softprops/action-gh-release@v2
      with:
        files: stopwatch-hook-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
