name: Build AutoGG Button Release

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autogg-button-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NDK_VERSION: 27.2.12479018
  MODULE_NAME: AutoGGButton

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27c and Ninja
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip

      - name: Configure Android ARM64 Release build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build .so
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-android --parallel

      - name: Prepare Release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "build-android/lib${MODULE_NAME}.so" "dist/package/lib${MODULE_NAME}.so"
          echo "# AutoGG Button Mod" > dist/package/README.md
          echo "" >> dist/package/README.md
          echo "Botão flutuante para enviar mensagens automáticas no chat do Minecraft Bedrock." >> dist/package/README.md
          echo "" >> dist/package/README.md
          echo "## Como usar:" >> dist/package/README.md
          echo "- **Clique**: Envia a mensagem configurada no chat" >> dist/package/README.md
          echo "- **Segure/Pressione**: Abre o menu de configuração para mudar o texto" >> dist/package/README.md
          echo "- **Arraste**: Move o botão pela tela" >> dist/package/README.md
          echo "" >> dist/package/README.md
          echo "## Instalação:" >> dist/package/README.md
          echo "1. Coloque o .so no launcher (Toolbox, Inner Core, etc)" >> dist/package/README.md
          echo "2. Inicie o Minecraft" >> dist/package/README.md
          echo "3. O botão aparecerá automaticamente" >> dist/package/README.md
          (cd dist/package && sha256sum "lib${MODULE_NAME}.so" > "lib${MODULE_NAME}.so.sha256")
          (cd dist/package && zip -9 "../${MODULE_NAME}-arm64-v8a.zip" "lib${MODULE_NAME}.so" "lib${MODULE_NAME}.so.sha256" README.md)
          cp "dist/package/lib${MODULE_NAME}.so" dist/
          cp "dist/package/lib${MODULE_NAME}.so.sha256" dist/

      - name: Publish only to rolling GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="continuous-${GITHUB_REF_NAME}"
          TITLE="${MODULE_NAME} continuous (${GITHUB_REF_NAME})"
          NOTES="AutoGG Button - Botão flutuante com mensagem customizável para Minecraft Bedrock. Build automático ARM64."

          retry() {
            local tries=0
            local max=3
            until "$@"; do
              tries=$((tries + 1))
              if [ "$tries" -ge "$max" ]; then
                echo "Command failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "Temporary GitHub operation failure; retrying ($((tries + 1))/${max})..." >&2
              sleep $((tries * 5))
            done
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            retry gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true \
              --silent

            retry gh release upload "$TAG" \
              "dist/${MODULE_NAME}-arm64-v8a.zip" \
              "dist/lib${MODULE_NAME}.so" \
              "dist/lib${MODULE_NAME}.so.sha256" \
              --clobber

            retry gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          else
            retry gh release create "$TAG" \
              "dist/${MODULE_NAME}-arm64-v8a.zip" \
              "dist/lib${MODULE_NAME}.so" \
              "dist/lib${MODULE_NAME}.so.sha256" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
